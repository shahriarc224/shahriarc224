<svg xmlns="http://www.w3.org/2000/svg" width="3" height="400" viewBox="0 0 3 400" preserveAspectRatio="none">
  <!-- Neon vertical divider: violet -> purple -> neon blue, rounded pill ends, soft glow halo -->
  <defs>
    <linearGradient id="neon-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <rect x="-1.5" y="0" width="6" height="400" rx="3" fill="url(#neon-v)" opacity="0.12"/>
  <rect x="-0.75" y="0" width="4.5" height="400" rx="2.25" fill="url(#neon-v)" opacity="0.3"/>
  <rect x="0" y="0" width="3" height="400" rx="1.5" fill="url(#neon-v)"/>
</svg>
